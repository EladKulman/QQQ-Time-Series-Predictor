name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -S demo.py
      - run: python -m unittest discover -s tests -p test_demo.py -v
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch>=2.2,<2.12' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_feature_table.py
      - run: python scripts/audit_processed_data.py --leakage
      - run: python demo.py --mode pretrained --prepare-only
